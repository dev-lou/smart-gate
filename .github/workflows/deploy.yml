# ─── Deploy: Production + Preview ───────────────────────────
# Uses the official Vercel CLI (no third-party deploy action).
# Vercel's Git integration still creates per-branch previews; this
# workflow handles production rollouts, tags, and manual deploys.
#
# Prerequisites:
#   1. Create 3 Vercel projects, each with Root Directory =
#      services/dashboard (or guard/kiosk).
#   2. GitHub → Settings → Secrets and variables → Actions:
#      VERCEL_TOKEN, VERCEL_ORG_ID,
#      VERCEL_DASHBOARD_PROJECT_ID, VERCEL_GUARD_PROJECT_ID,
#      VERCEL_KIOSK_PROJECT_ID, NEXT_PUBLIC_SUPABASE_URL,
#      NEXT_PUBLIC_SUPABASE_ANON_KEY
#   3. Optional: create a protected "production" environment to
#      require manual approval before a production deploy.

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - dashboard
          - guard
          - kiosk
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

# Least privilege — deploys read the repo and use Vercel token secrets.
permissions:
  contents: read

# Never run two deploys of the same ref at once; let a running
# production deploy finish instead of cancelling it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}

jobs:
  # ─── Gate: Verify code before deploying ───────────────────
  # (Vercel builds the app itself, so this job only proves the
  # source type-checks and the tests pass.)
  check:
    name: 🔍 Pre-deploy Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (all services)
        run: pnpm typecheck

      - name: Run tests
        working-directory: services/kiosk
        run: npx vitest run --reporter=verbose

  # ─── Deploy to Vercel ─────────────────────────────────────
  deploy:
    name: 🚀 Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    if: |
      success() &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.service == 'all' ||
       github.event.inputs.service == matrix.service)
    strategy:
      fail-fast: false
      matrix:
        service:
          - dashboard
          - guard
          - kiosk
        include:
          - service: dashboard
            vercel-project-id: ${{ secrets.VERCEL_DASHBOARD_PROJECT_ID }}
          - service: guard
            vercel-project-id: ${{ secrets.VERCEL_GUARD_PROJECT_ID }}
          - service: kiosk
            vercel-project-id: ${{ secrets.VERCEL_KIOSK_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project settings & env
        working-directory: services/${{ matrix.service }}
        run: vercel pull --yes --environment=${{ env.TARGET_ENV }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ matrix.vercel-project-id }}

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: vercel build ${{ env.TARGET_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ matrix.vercel-project-id }}

      - name: Deploy ${{ matrix.service }} to Vercel
        working-directory: services/${{ matrix.service }}
        run: vercel deploy --prebuilt ${{ env.TARGET_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ matrix.vercel-project-id }}
